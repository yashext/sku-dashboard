// Compact signed rupee for daily lift labels: +₹22k, -₹856, +₹1.2L
function fmtLiftShort(n) {
  if (n == null) return "—";
  const sign = n >= 0 ? "+" : "-";
  const a = Math.abs(n);
  if (a >= 100000) return `${sign}₹${(a / 100000).toFixed(1).replace(/\.0$/, "")}L`;
  if (a >= 1000) return `${sign}₹${Math.round(a / 1000)}k`;
  return `${sign}₹${Math.round(a)}`;
}
